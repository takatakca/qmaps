name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate workflow YAML
        run: |
          ruby -e 'require "yaml"; Dir.glob(".github/workflows/*.{yml,yaml}").each { |file| YAML.parse_file(file); puts file }'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Test the pilot verifier without network access
        run: python3 -B -m unittest discover -s scripts -p test_verify_montreal_pilot.py

      - name: Launch checks
        run: bun run launch:check

      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: qmaps-ci-placeholder
          VITE_SUPABASE_PROJECT_ID: qmaps-ci

      - name: Go / No-Go (JSON)
        run: bun run go:no-go:json
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: qmaps-ci-placeholder
          VITE_SUPABASE_PROJECT_ID: qmaps-ci
