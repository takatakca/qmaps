name: QMAPS SSH deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qmaps-production-deploy
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ vars.QMAPS_DEPLOY_ENABLED == 'true' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
      - name: Require newest validated main revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -z "$CURRENT_SHA" ] || [ "$CURRENT_SHA" != "$EXPECTED_SHA" ]; then
            echo "Deploy cancelled: this CI artifact is not the current main revision" >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
            echo "Deploy cancelled: checked-out source does not match approved SHA" >&2
            exit 1
          fi
      - name: Check deployment configuration
        shell: bash
        env:
          HOST: ${{ secrets.QMAPS_DEPLOY_HOST }}
          USER: ${{ secrets.QMAPS_DEPLOY_USER }}
          ROOT: ${{ secrets.QMAPS_DEPLOY_WEB_ROOT }}
          PRIVATE_KEY: ${{ secrets.QMAPS_DEPLOY_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.QMAPS_DEPLOY_KNOWN_HOSTS }}
          PUBLIC_URL: ${{ secrets.QMAPS_PRODUCTION_URL }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: |
          for key in HOST USER ROOT PRIVATE_KEY KNOWN_HOSTS PUBLIC_URL SUPABASE_URL SUPABASE_KEY SUPABASE_ID; do
            if [ -z "${!key}" ]; then echo "Missing configuration: $key" >&2; exit 1; fi
          done
          case "$ROOT" in /*) ;; *) echo 'Web root must be absolute' >&2; exit 1;; esac
          case "$PUBLIC_URL" in https://qmaps.ca|https://qmaps.ca/|https://www.qmaps.ca|https://www.qmaps.ca/) ;; *) echo 'Production URL must be qmaps.ca or www.qmaps.ca over HTTPS' >&2; exit 1;; esac
      - name: Build static frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_LOVABLE_CONNECTOR_GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.VITE_LOVABLE_CONNECTOR_GOOGLE_MAPS_BROWSER_KEY }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          bun install --frozen-lockfile
          bun run build
          test -f dist/index.html
          printf '{"sha":"%s"}\n' "$DEPLOY_SHA" > dist/qmaps-release.json
          cat > dist/.htaccess <<'HTACCESS'
          <IfModule mod_rewrite.c>
          RewriteEngine On
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule ^ index.html [L]
          </IfModule>
          HTACCESS
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.QMAPS_DEPLOY_SSH_PRIVATE_KEY }}
      - name: Deploy to dedicated static web root
        env:
          HOST: ${{ secrets.QMAPS_DEPLOY_HOST }}
          PORT: ${{ secrets.QMAPS_DEPLOY_PORT }}
          USER: ${{ secrets.QMAPS_DEPLOY_USER }}
          ROOT: ${{ secrets.QMAPS_DEPLOY_WEB_ROOT }}
          KNOWN_HOSTS: ${{ secrets.QMAPS_DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$KNOWN_HOSTS" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          PORT="${PORT:-22}"
          rsync -az -e "ssh -p $PORT -o StrictHostKeyChecking=yes" dist/ "$USER@$HOST:$ROOT/"
      - name: Verify exact deployed revision
        shell: bash
        env:
          PRODUCTION_URL: ${{ secrets.QMAPS_PRODUCTION_URL }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          BASE_URL="${PRODUCTION_URL%/}"
          curl --fail --location --silent --show-error --retry 2 "$BASE_URL/" >/dev/null
          RELEASE="$(curl --fail --location --silent --show-error --retry 2 "$BASE_URL/qmaps-release.json")"
          EXPECTED="$(printf '{"sha":"%s"}' "$DEPLOY_SHA")"
          if [ "$RELEASE" != "$EXPECTED" ]; then
            echo "Deploy verification failed: live revision differs from approved commit" >&2
            exit 1
          fi
          echo "QMAPS release verified: $DEPLOY_SHA"
