name: Merchant and guest database journeys
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: local-test
          POSTGRES_DB: qmaps_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and verify database access
        env:
          PGHOST: localhost
          PGDATABASE: qmaps_test
          PGUSER: postgres
          PGPASSWORD: local-test
        run: |
          psql -X --set ON_ERROR_STOP=1 \
            -f scripts/testdb/guest-content-fixture.sql \
            -f supabase/migrations/20261121060007_merchant_public_content.sql \
            -f supabase/migrations/20261121060249_guest_requests.sql \
            -f supabase/migrations/20261121060842_business_mailbox.sql \
            -f supabase/migrations/20261121061220_customer_media_uploads.sql \
            -f supabase/migrations/20261121061557_merchant_profile_and_endorsements.sql \
            -c BEGIN -f scripts/testdb/guest-content-check.sql -c ROLLBACK
      - name: Exercise the customer and merchant journeys over HTTP
        run: |
          export PGRST_JWT_SECRET="$(openssl rand -hex 32)"
          docker run -d --rm --name qmaps-test-api --network host \
            -e PGRST_JWT_SECRET -e PGRST_SERVER_HOST=127.0.0.1 -e PGRST_SERVER_PORT=25490 \
            -e PGRST_DB_URI=postgresql://postgres:local-test@127.0.0.1:5432/qmaps_test \
            -e PGRST_DB_ANON_ROLE=anon postgrest/postgrest:v14.5
          trap 'docker stop qmaps-test-api >/dev/null' EXIT
          curl --fail --silent --retry 15 --retry-connrefused --retry-delay 1 \
            'http://127.0.0.1:25490/businesses?select=id' >/dev/null
          node scripts/testdb/merchant-journeys-http.mjs
  full-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Apply the complete QMAPS migration history on an isolated stack
        run: |
          umask 077
          supabase start --exclude realtime,imgproxy,studio,postgres-meta,edge-runtime,logflare,vector,supavisor > "$RUNNER_TEMP/qmaps-start.log"
          supabase status -o json > "$RUNNER_TEMP/qmaps-ephemeral.json"
      - name: Exercise Auth, Data API and Storage
        run: node scripts/testdb/supabase-stack.mjs "$RUNNER_TEMP/qmaps-ephemeral.json"
