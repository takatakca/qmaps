services:
  qmaps-db:
    build:
      context: .
      dockerfile: server/Dockerfile.db
    environment:
      POSTGRES_DB: qmaps
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES:?required}
      QMAPS_GATEWAY_PASSWORD: ${SERVICE_PASSWORD_GATEWAY:?required}
    volumes:
      - qmaps-postgresql:/var/lib/postgresql/data
      - qmaps-logical-backups:/var/backups/qmaps
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d qmaps"]
      interval: 8s
      timeout: 4s
      retries: 20
    restart: unless-stopped
  qmaps-migrate:
    build:
      context: .
      dockerfile: server/Dockerfile.db
    entrypoint: ["sh", "/opt/qmaps/server/db/apply-upgrades.sh"]
    environment:
      PGHOST: qmaps-db
      PGUSER: postgres
      PGDATABASE: qmaps
      PGPASSWORD: ${SERVICE_PASSWORD_POSTGRES:?required}
    depends_on:
      qmaps-db:
        condition: service_healthy
    restart: "no"
  qmaps-api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PGHOST: qmaps-db
      PGDATABASE: qmaps
      PGUSER: qmaps_gateway
      PGPASSWORD: ${SERVICE_PASSWORD_GATEWAY:?required}
    expose: ["3000"]
    depends_on:
      qmaps-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:3000/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  qmaps-signing:
    build:
      context: .
      dockerfile: server/signing/Dockerfile
    volumes:
      - qmaps-signing:/var/lib/qmaps-signing
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: [signing]
    restart: unless-stopped
networks:
  signing:
    internal: true
volumes:
  qmaps-postgresql:
  qmaps-logical-backups:
  qmaps-signing:
